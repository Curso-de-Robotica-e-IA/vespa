site_name: Vespa Documentation
theme:
  name: material
  features:
    - navigation.tabs
    - search.highlight

nav:
  - Home: index.md
  - Installation:
      - Overview: installation/installation.md
      - Requirements: installation/requirements.md
      - Configuration: installation/configuration.md
  - Usage:
      - Setup: usage/setup.md
      - Examples: usage/examples.md
      - CLI Usage: usage/cli-usage.md
      - API Integration: usage/api-integration.md
  - API:
      - Overview: api/index.md
      - Authentication: api/authentication.md
      - Training: api/training.md
      - Prediction: api/prediction.md
      - Models: api/models.md
  - Datasets:
      - Overview: datasets/overview.md
      - Dataset 1: datasets/dataset1.md
      - Dataset 2: datasets/dataset2.md
  - Methods:
      - Classification: methods/classification.md
      - Regression: methods/regression.md
      - Object Detection: methods/object-detection.md
  - Development:
      - Code Structure: development/structure.md
      - Testing: development/testing.md
      - Contributing: development/contributing.md
      - Deployment: development/deployment.md
  - FAQ: faq.md
  - About: about.md

plugins:
  - search
  - mkdocstrings
